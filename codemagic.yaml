workflows:
  mac-build:
    name: CustomerApp Mac Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install Python and PyInstaller
        script: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller
      - name: Build the Mac application
        script: |
          python3 -m PyInstaller -F -w customers.py
      - name: Package the application
        script: |
          cd dist
          zip -r CustomerApp_Mac.zip customers.app
    artifacts:
      - dist/CustomerApp_Mac.zip
      - dist/customers.app/**/*
